<!doctype html>
<html lang="en">
<head>

  <meta name="description" content="Explore every DevBoost feature: visual inspection, captures, API testing, audits, responsive previews, and debugging tools.">
  <title>DevBoost | Feature Guide</title>
  <link rel="icon" href="media/icon48.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#overview" aria-label="DevBoost overview">
        <img src="media/icon48.png" alt="" width="30" height="30">
        <span>DevBoost</span>
      </a>
      <span class="header-context">Feature guide <span class="header-version">v1.0.7</span></span>
      <nav class="header-links" aria-label="External links">
